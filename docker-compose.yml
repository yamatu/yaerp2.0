services:
  nginx:
    image: nginx:alpine
    ports:
      - "5555:5555"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - minio
    restart: unless-stopped

  frontend:
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PPROF_ENABLED: ${PPROF_ENABLED:-false}
      PPROF_TOKEN: ${PPROF_TOKEN:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-67108864}
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-268435456}
      # Shared with the proxy container so the pushed configuration survives a
      # restart of the core instead of only living in its memory.
      MIHOMO_CONFIG_DIR: ${MIHOMO_CONFIG_DIR:-/mihomo-config}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - mihomo_config:/mihomo-config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      whatsapp:
        condition: service_started
      proxy:
        condition: service_started
    restart: unless-stopped

  # XTLS / Clash.Meta core. The backend drives it through the external
  # controller REST API (see PROXY.md); the config directory lives in a named
  # volume shared with the backend, so the pushed configuration (nodes, group,
  # selected node) and the geo databases survive restarts.
  proxy:
    image: metacubex/mihomo:latest
    # On the very first boot mihomo writes a minimal config.yaml (mixed-port
    # 7890) into the volume; the backend then pushes the real config. -ext-ctl
    # exposes the controller to the other containers, and the secret comes
    # from MIHOMO_CONTROLLER_SECRET so it is set before the first push.
    command:
      - -d
      - /root/.config/mihomo
      - -ext-ctl
      - 0.0.0.0:9090
    environment:
      CLASH_OVERRIDE_SECRET: ${MIHOMO_CONTROLLER_SECRET:-}
    volumes:
      - mihomo_config:/root/.config/mihomo
    ports:
      - "127.0.0.1:${MIHOMO_PUBLISH_PORT:-7890}:${MIHOMO_MIXED_PORT:-7890}"
      - "127.0.0.1:9090:9090"
    # Informational: lets `docker compose ps` show whether the REST controller
    # is really listening (the usual cause of "内核离线" in the ERP page).
    # Any HTTP answer counts, so a configured secret does not break it.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:9090/version 2>&1 | grep -q 'HTTP/'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - WHATSAPP_WEBHOOK_URL=http://backend:8080/api/internal/whatsapp/events
      - WHATSAPP_DATA_DIR=/data
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - whatsapp_auth:/data
    shm_size: 1gb
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yaerp}
      POSTGRES_USER: ${POSTGRES_USER:-yaerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaerp_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./backend/migrations/002_folders.sql:/docker-entrypoint-initdb.d/002_folders.sql
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yaerp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_2024}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_2024}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-yaerp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_2024}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  whatsapp_auth:
  mihomo_config:
